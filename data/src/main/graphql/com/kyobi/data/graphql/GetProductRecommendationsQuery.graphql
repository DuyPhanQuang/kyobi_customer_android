query GetProductRecommendations($productId: ID!) {
    productRecommendations(productId: $productId) {
        id
        handle
        availableForSale
        title
        description
        descriptionHtml
        options {
            id
            name
            values
        }
        priceRange {
            maxVariantPrice {
                amount
                currencyCode
            }
            minVariantPrice {
                amount
                currencyCode
            }
        }
        compareAtPriceRange {
            maxVariantPrice {
                amount
                currencyCode
            }
            minVariantPrice {
                amount
                currencyCode
            }
        }
        variants(first: 250) {
            edges {
                node {
                    id
                    sku
                    barcode
                    title
                    availableForSale
                    selectedOptions {
                        name
                        value
                    }
                    price {
                        amount
                        currencyCode
                    }
                    image {
                        url
                        altText
                        width
                        height
                    }
                    quantityAvailable
                    quantityRule {
                        increment
                        minimum
                        maximum
                    }
                    taxable
                    compareAtPrice {
                        amount
                        currencyCode
                    }
                }
            }
        }
        featuredImage {
            url
            altText
            width
            height
        }
        images(first: 20) {
            edges {
                node {
                    url
                    altText
                    width
                    height
                }
            }
        }
        seo {
            description
            title
        }
        tags
        updatedAt
    }
}