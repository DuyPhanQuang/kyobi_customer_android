query GetMetaobjectsByIdsForFlashsale($ids: [ID!]!) {
    nodes(ids: $ids) {
        ... on Metaobject {
            id
            handle
            type
            fields {
                key
                value
                reference {
                    ... on MediaImage {
                        id
                        image {
                            url
                            altText
                            width
                            height
                        }
                    }
                }
            }
        }
    }
}